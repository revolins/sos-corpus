name: Publish to PyPI

# Releases the sos-speeches loader package. The loader always fetches the
# latest corpus release, so this runs only when the loader code changes:
#   - push a tag py-vX.Y.Z (matching pyproject.toml) -> PyPI
#   - run manually                                    -> TestPyPI (dry run)
# Uses PyPI Trusted Publishing (OIDC); no API token is stored.

on:
  push:
    tags: ['py-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          MOD_VERSION=$(python -c "import re; print(re.search(r\"__version__ = '([^']+)'\", open('sos_speeches/__init__.py').read()).group(1))")
          TAG_VERSION="${GITHUB_REF_NAME#py-v}"
          echo "tag=$TAG_VERSION pyproject=$PKG_VERSION module=$MOD_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$PKG_VERSION" != "$MOD_VERSION" ]; then
            echo "::error::Version mismatch: tag $TAG_VERSION, pyproject $PKG_VERSION, __version__ $MOD_VERSION"
            exit 1
          fi

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sos-speeches
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sos-speeches
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
