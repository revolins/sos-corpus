[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sos-speeches"
version = "0.1.0"
description = "U.S. Secretary of State speech corpus, 1997-present, updated weekly with new Rubio-era speeches"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Benjamin Yoel"},
    {name = "Jay Revolinsky"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Sociology",
]
# The loader uses only the standard library; pandas is optional.
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3.0"]
dev = ["pytest>=6.0"]

[project.urls]
Repository = "https://github.com/revolins/sos-corpus"
"Hugging Face" = "https://huggingface.co/datasets/JayRevolinsky/sos-secretary-speeches"

[tool.hatch.build.targets.wheel]
packages = ["sos_speeches"]

# Keep the sdist to the loader only -- without this, hatchling ships every
# tracked file, including the 43 MB r-package/ and the pipeline scripts.
[tool.hatch.build.targets.sdist]
include = [
    "/sos_speeches/",
    "/README.md",
    "/LICENSE",
    "/DATA_LICENSE",
    "/pyproject.toml",
]
